name: Add Labels

on:
  pull_request_target:
    types: [opened, edited]

jobs:
  add_labels:
    runs-on: ubuntu-26.04
    if: github.actor != 'renovate[bot]'
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions-ecosystem/action-remove-labels@2ce5d41b4b6aa8503e285553f75ed56e0a40bae0 # v1
        with:
          labels: |
            kind/api-change
            kind/bug
            kind/cleanup
            kind/deprecation
            kind/design
            kind/documentation
            kind/failing
            kind/feature
            kind/flake
            kind/regression

      - uses: actions-ecosystem/action-regex-match@9e6c4fb3d5e898f505be7a1fb6e7b0a278f6665b # v2
        id: regex-match
        with:
          text: ${{ github.event.pull_request.body }}
          regex: '(?<!> )\/kind (\w+)'



      - name: Check
        run: |
          if [[ ! "${{ steps.regex-match.outputs.group1 }}" =~ ^(api-change|bug|cleanup|deprecation|design|documentation|failing|feature|flake|regression)$ ]]; then
            echo "kind must belong to
                  - api-change \
                  - bug \
                  - cleanup \
                  - deprecation \
                  - design \
                  - documentation \
                  - failing \
                  - feature \
                  - flake \
                  - regression \
            please add /kind [type] to the body of the PR"
            exit 1
          fi
      - uses: actions-ecosystem/action-add-labels@18f1af5e3544586314bbe15c0273249c770b2daf # v1
        with:
          labels: kind/${{ steps.regex-match.outputs.group1 }}
