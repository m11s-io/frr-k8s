name: Vuln check
on:
  schedule: 
    - cron: '0 */6 * * *'

permissions: 
  security-events: write

jobs:
  vuln-check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Golang Vulncheck
        uses: Templum/govulncheck-action@6bb063b41d78c53c2fc7f5589828e30ad7c697ee # v1.0.0

